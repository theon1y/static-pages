main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }

  display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line);

.title { font-family: var(--f-display); font-weight: 600; font-size: 19px; }
.path { color: var(--muted); font-family: var(--f-mono); font-size: 13px; }
</style>
</head>
